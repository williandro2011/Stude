
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d18">
  <meta name="description" content="Stude.me — um novo espaço para aprender, descobrir e evoluir.">
  <title>Stude.me — Em breve</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 110%, #142c50 0%, transparent 55%),
        #080d18;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 24px;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 10% 20%, #ffffff 100%, transparent),
        radial-gradient(2px 2px at 80% 30%, #ffffff 100%, transparent),
        radial-gradient(1px 1px at 40% 70%, #ffffff 100%, transparent),
        radial-gradient(2px 2px at 65% 85%, #ffffff 100%, transparent),
        radial-gradient(1px 1px at 90% 75%, #ffffff 100%, transparent);
      opacity: .5;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 760px;
      text-align: center;
      animation: appear 1.2s ease both;
    }

    .logo {
      font-size: clamp(52px, 10vw, 88px);
      font-weight: 800;
      letter-spacing: -5px;
      background: linear-gradient(120deg, #ffffff 20%, #8cbaff 65%, #54d6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 24px;
    }

    .tag {
      display: inline-block;
      padding: 9px 17px;
      border: 1px solid rgba(112, 175, 255, .3);
      border-radius: 50px;
      color: #9fcaff;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 30px;
      background: rgba(35, 91, 160, .12);
    }

    h1 {
      font-size: clamp(30px, 6vw, 52px);
      line-height: 1.15;
      letter-spacing: -1.5px;
      margin-bottom: 20px;
    }

    .description {
      max-width: 530px;
      margin: 0 auto;
      color: #a8b5c9;
      font-size: 17px;
      line-height: 1.8;
    }

    .line {
      width: 65px;
      height: 3px;
      border-radius: 10px;
      margin: 38px auto;
      background: linear-gradient(90deg, #568bff, #54d6ff);
      box-shadow: 0 0 20px #368fff;
    }

    footer {
      color: #64748b;
      font-size: 12px;
      letter-spacing: 1px;
      margin-top: 50px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .logo {
        letter-spacing: -3px;
      }

      .description {
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="stars"></div>

  <main class="container">
    <div class="tag">Um novo começo</div>

    <div class="logo">Stude.me</div>

    <h1>O futuro da aprendizagem começa aqui.</h1>

    <p class="description">
      Estamos construindo um novo espaço para aprender,
      explorar ideias e transformar conhecimento em possibilidades.
      <br><br>
      Em breve, você descobrirá tudo o que estamos preparando.
    </p>

    <div class="line"></div>

    <footer>
      © 2026 STUDE.ME · TODOS OS DIREITOS RESERVADOS
    </footer>
  </main>
</body>
</html>
